[Civ3Borderless]
; ============================================================================
;  Civ3 Borderless -- configuration
;  Delete this file (or set Enabled=0) to get the stock game back.
; ============================================================================

; 1 = apply the patch, 0 = do nothing at all
Enabled=1

; ---------------------------------------------------------------------------
;  The "virtual display": the resolution the game engine is told the screen
;  is. Everything the engine draws is laid out at this size and then scaled
;  up to your monitor, so this number IS the UI scale.
;
;  0 / 0 = automatic (recommended). The engine always renders a 16:9 frame --
;          the aspect Civ3's interface was designed for -- and the result is
;          centred with black bars on anything wider or taller. The largest
;          integer scale that fits is chosen:
;
;              1920x1080 (16:9)  -> 1920x1080  1x   fills exactly
;              2560x1440 (16:9)  -> 1280x720   2x   fills exactly
;              3840x2160 (16:9)  -> 1920x1080  2x   fills exactly
;              3440x1440 (21:9)  -> 1280x720   2x   440px pillar bars
;              5120x1440 (32:9)  -> 1280x720   2x   1280px pillar bars
;              2560x1600 (16:10) -> 1280x720   2x   80px letterbox
;              1024x768  (4:3)   -> 1024x576   1x   96px letterbox
;
;  Pin both to force a size. Pinning a non-16:9 pair (e.g. 1720x720 on a 21:9
;  panel) makes the engine lay out its HUD for that wider aspect and removes the
;  bars -- the image is no longer 16:9, it is stretched wide by design.
; ---------------------------------------------------------------------------
LogicalWidth=0
LogicalHeight=0

; How the logical image is placed on the monitor:
;   integer  - integer scale factor, centred, black bars if the aspect differs
;   fit      - largest fractional scale, centred, black bars   (soft)
;   stretch  - fill the whole monitor, ignoring aspect ratio   (distorts)
Fit=integer

; Which monitor to use. 0 = primary, 1 = second, ...
Monitor=0

; 1 = remove the title bar/borders and cover the whole monitor
Borderless=1

; 1 = scale the engine's frame up to the window (this is the UI scaling)
ScalePresent=1

; 1 = keep the mouse inside the game's monitor while the window has focus, and
; release it the instant anything else is focused. Without this, a borderless
; window loses edge-scrolling to a monitor sitting next to it.
LockCursor=1

; 1 = make the process per-monitor DPI aware before the engine creates its
; window. Without this Windows bitmap-stretches the whole game at 150%.
DpiAware=1

; ---------------------------------------------------------------------------
;  Diagnostics. 0 = silent. 1 = write civ3bl.log next to the exe.
; 2 = verbose. LogBlits=1 adds per-frame present logging.
; ---------------------------------------------------------------------------
LogLevel=0
LogBlits=0

; ---------------------------------------------------------------------------
;  Advanced: which APIs are lied to about the virtual display size.
;  Leave all three at 1 unless you are debugging a specific problem --
;  the engine computes buffer sizes and strides from these and they must
;  agree with each other.
; ---------------------------------------------------------------------------
LieScreen=1
LieClientRect=1
LieDeviceCaps=1
